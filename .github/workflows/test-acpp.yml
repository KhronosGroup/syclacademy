name: Test AdaptiveCpp

on: [push, pull_request]

jobs:
  test-acpp:
    name: acpp llvm ${{ matrix.clang }}, ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        clang: [20]
        os: [ubuntu-22.04]
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: 'recursive'
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.14"
    - name: Keep downloaded apt packages
      run: echo 'Binary::apt::APT::Keep-Downloaded-Packages "true";' | sudo tee /etc/apt/apt.conf.d/keep-cache
    - name: Take ownership of apt archives for cache restore
      run: |
        sudo mkdir -p /var/cache/apt/archives/partial
        sudo chown -R "$(id -u):$(id -g)" /var/cache/apt/archives
    - name: Cache apt packages
      uses: actions/cache@v4
      with:
        path: /var/cache/apt/archives
        key: ${{ runner.os }}-apt-clang${{ matrix.clang }}-${{ hashFiles('.github/workflows/test-acpp.yml') }}
        restore-keys: |
          ${{ runner.os }}-apt-clang${{ matrix.clang }}-
          ${{ runner.os }}-apt-
    - name: Install OpenCL
      run: |
        sudo wget -O- https://apt.repos.intel.com/intel-gpg-keys/GPG-PUB-KEY-INTEL-SW-PRODUCTS.PUB | sudo gpg --dearmor | sudo tee /usr/share/keyrings/oneapi-archive-keyring.gpg > /dev/null
        echo "deb [signed-by=/usr/share/keyrings/oneapi-archive-keyring.gpg] https://apt.repos.intel.com/oneapi all main" | sudo tee /etc/apt/sources.list.d/oneAPI.list
        sudo apt-get update
        sudo apt-get install -y intel-oneapi-runtime-opencl-2024 intel-oneapi-runtime-compilers-2024 ocl-icd-libopencl1 ocl-icd-opencl-dev cmake ninja-build build-essential git
    - name: install LLVM
      run: |
        wget https://apt.llvm.org/llvm.sh
        chmod +x llvm.sh
        sudo ./llvm.sh ${{matrix.clang}}
        sudo apt install libclang-${{matrix.clang}}-dev clang-tools-${{matrix.clang}} libomp-${{matrix.clang}}-dev
    - name: Make apt archives readable for cache save
      run: sudo chmod -R a+rX /var/cache/apt/archives
    - name: cache AdaptiveCPP build
      id: cache-adaptivecpp
      uses: actions/cache@v4
      with: 
        path: ${{ github.workspace }}/adaptivecpp/build/install
        key: ${{ runner.os }}-adaptivecpp-v25.10.0-clang${{ matrix.clang }}
    - name: build AdaptiveCpp
      if: steps.cache-adaptivecpp.outputs.cache-hit != 'true'
      run: |
        git clone https://github.com/adaptivecpp/adaptivecpp -b v25.10.0
        mkdir -p adaptivecpp/build && cd adaptivecpp/build
        cmake -DCMAKE_CXX_COMPILER=/usr/bin/clang++-${{matrix.clang}} -DCLANG_EXECUTABLE_PATH=/usr/bin/clang++-${{matrix.clang}} -DLLVM_DIR=/usr/lib/llvm-${{matrix.clang}}/cmake -DWITH_OPENCL_BACKEND=ON -DCMAKE_INSTALL_PREFIX=`pwd`/install ..
        make -j2 install
    - name: Print detected devices
      run: |
        ${GITHUB_WORKSPACE}/adaptivecpp/build/install/bin/acpp-info
    - name: Build SYCLAcademy
      run: |
        mkdir -p ${GITHUB_WORKSPACE}/build && cd ${GITHUB_WORKSPACE}/build
        cmake  -DSYCL_ACADEMY_USE_ADAPTIVECPP=ON -DSYCL_ACADEMY_ENABLE_SOLUTIONS=ON -DSYCL_ACADEMY_INSTALL_ROOT=${GITHUB_WORKSPACE}/adaptivecpp/build/install  ..
        make -j2
    - name: Extract and compile lesson code blocks
      run: |
        ACPP="${GITHUB_WORKSPACE}/adaptivecpp/build/install/bin/acpp"
        OUT="${GITHUB_WORKSPACE}/lesson_snippets"
        LESSON="Lesson_Materials/Handling_Errors/index.html"
        python ./Scripts/LessonChecker.py --extract -o "${OUT}" "${LESSON}"
        status=0
        # (re)generate the CTest test list so ctest can run the compiled snippets
        TESTFILE="${OUT}/CTestTestfile.cmake"
        : > "${TESTFILE}"
        for src in "${OUT}"/*.cpp; do
          echo "Compiling ${src}"
          if ! "${ACPP}" "${src}" -o "${src}.out"; then
            echo "::error::Failed to compile lesson code block ${src}"
            status=1
            continue
          fi
          name="$(basename "${src}" .cpp)"
          echo "add_test(${name} \"${src}.out\")" >> "${TESTFILE}"
        done
        exit $status
    - name: Run lesson code blocks (OpenCL backend)
      run: |
        cd ${GITHUB_WORKSPACE}/lesson_snippets
        ACPP_VISIBILITY_MASK="ocl" ctest
    - name: Run SYCLAcademy solutions (OpenMP backend)
      run: |
        cd ${GITHUB_WORKSPACE}/build
        ACPP_VISIBILITY_MASK="omp" ctest || { cat Testing/Temporary/LastTest.log && false; }
    - name: Run SYCLAcademy solutions (OpenCL backend)
      run: |
        cd ${GITHUB_WORKSPACE}/build
        ACPP_VISIBILITY_MASK="ocl" ctest --exclude-regex "Enq"
